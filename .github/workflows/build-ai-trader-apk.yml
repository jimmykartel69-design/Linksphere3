name: Build AI Trader APK
on:
  push:
    branches: [ai-trader-apk]
    paths:
      - 'tools/ai-trader-android/**'
      - '.github/workflows/build-ai-trader-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    defaults:
      run:
        working-directory: tools/ai-trader-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify APK
        run: ls -lh app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Trader-Android-V1
          path: tools/ai-trader-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish APK on build branch
        working-directory: .
        run: |
          mkdir -p dist
          cp tools/ai-trader-android/app/build/outputs/apk/debug/app-debug.apk dist/AI-Trader-Android-V1.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/AI-Trader-Android-V1.apk
          git commit -m "Build AI Trader Android V1 APK" || exit 0
          git push origin HEAD:ai-trader-apk
